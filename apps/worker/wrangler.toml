name = "library-catalog"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The built React PWA. Static files are served directly; anything that is not a
# file falls through to the Worker, which serves index.html for SPA routes.
# Run `npm run build` at the repo root before `wrangler dev` or `deploy`.
[assets]
directory = "../web/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "library-catalog"
# Created 2026-08-09 in region WNAM, account nbaslamking@gmail.com.
#
# ⚠️ The binding stays `DB`, not the `library_catalog` that `wrangler d1 create`
# suggests in its copy-paste snippet. `env.ts` and every query in `packages/db`
# take `c.env.DB`; renaming the binding to match the snippet would break all of
# them for no gain.
database_id = "6022ea5e-2510-450e-81ce-7d847fa31379"
# Migrations live at the repo root so the CLI can reach them too.
migrations_dir = "../../migrations"

# ⚠️ No R2 bucket for SCAN PHOTOS, and that is permanent. They go from the upload
# request straight into the vision call and are gone. The sibling project removed
# its bucket for exactly this reason — it was write-only, nothing ever read an
# object back, so its whole purpose was to be deleted later, and one code path
# forgetting to delete was all it would have taken to keep photos forever.
#
# COVERS ARE THE OPPOSITE CASE and have their own bucket, added 2026-08-11. A
# cover is read on every page load forever and deleting one is the bug. Do not
# read the rule above as "this project does not use R2" — it is about photographs.
[[r2_buckets]]
binding = "COVERS"
bucket_name = "library-covers"

# This Worker's FIRST cron trigger (added 2026-08-16). Everything below about
# what a cron does and does not prove was written while there were none; it all
# still applies, and now there is something to apply it to.
#
# "7 * * * *" — the hourly missing-details sweep (owner ask 2026-08-16): if a
# book is still missing a detail nobody has ever looked for, look for it,
# without being asked. `src/lib/details-sweep.ts` carries the whole design.
#
# ⚠️ This string is dispatched on by `scheduled()` in src/index.ts via
# DETAILS_SWEEP_CRON, and an unrecognised cron there does NOTHING rather than
# guessing. Change one of the two and the sweep stops firing while both files
# still look correct — which is why details-sweep.test.ts reads this file and
# asserts the string is still here.
#
# Minute 7, not 0: every cron in the world fires on the hour, and this one has
# no reason to join the stampede.
#
# ⚠️ The rule from the sibling project, learned from weeks of `wrangler deploy`
# reporting registered triggers that never fired: **a cron is not working until
# something it writes has rows.** For this one the proof is a `research_run` row
# with `triggered_by` NULL — that is precisely how a sweep's run is
# distinguishable from a person's. Until such a row exists, this trigger is
# claimed, not verified.
[triggers]
crons = ["7 * * * *"]

# The public hostname. Declared here rather than clicked in the dashboard so the
# mapping lives in git and a redeploy reasserts it.
#
# `custom_domain = true` makes Cloudflare create and manage the DNS record and
# the certificate. It works because heygabi.ai is registered in this same account
# (confirmed 2026-08-10), so the zone is already present — no nameserver change.
#
# ⚠️ ORDER MATTERS. Add `library.heygabi.ai` to Firebase Authentication →
# Settings → Authorised domains BEFORE relying on this host, or Google sign-in
# fails there with `auth/unauthorized-domain`. The workers.dev URL keeps working
# throughout, so there is no outage either way — but the new host will look
# broken at sign-in until Firebase knows about it.
#
# ⚠️ `library.` and not `books.`, deliberately. See catalog-platform's
# HEYGABI_LAYOUT.md §1.1: `books.` implies a sibling `ebooks.` host, and once
# both names exist someone eventually makes them two apps — which that document
# decided against, because splitting duplicates `work_key` and makes two apps
# write the same Firestore review document.
[[routes]]
pattern = "library.heygabi.ai"
custom_domain = true

[vars]
APP_VERSION = "0.1.0"
ENVIRONMENT = "production"

# ── The instance's DEFAULT THEME (owner ask 2026-08-16) ──────────────────────
#
# Defaults are identity (catalog-platform docs/info/estate-themes.md §3): this
# instance boots `apple`, hers boots `hearts`. A person's own pick in the
# topbar cog is stored in localStorage and always wins over this.
#
# ⚠️ NOTHING IN THE WORKER READS THIS — and that is not an oversight. Both
# instances serve the SAME apps/web/dist, so the default has to be resolved in
# the browser, and index.html does it from `location.hostname`
# (data-default-theme-by-host) before first paint. This var is the POSTURE OF
# RECORD, kept beside every other per-instance setting so the answer to "what
# does her site look like" is in one file; `apps/web/test/
# instance-default-theme.test.ts` reads this file and FAILS if the two ever
# disagree — the same guard the details-sweep cron string has.
#
# When the Worker grows a config surface the web app reads at boot, this var
# becomes the live source and the hostname map in index.html goes away.
DEFAULT_THEME = "apple"

# ── GABI, the conversational fixer — OFF HERE, ON PURPOSE ────────────────────
#
# `docs/info/gabi-fixer-design.md` §2, first goal: "Her instance only.
# `padhard.heygabi.ai`. The main library is out of scope and stays out until
# this has run on hers for a while." §12 decision 8 keeps it that way for v1 —
# when it does come here, the `runResearch` spend is the OWNER'S key rather than
# hers, and the blast radius is this whole catalog instead of hers.
#
# ⚠️ This var is the same POSTURE-OF-RECORD idiom as DEFAULT_THEME above, with
# one difference: the Worker DOES read this one (`gabiPanelEnabled` in
# `@lc/core`, the only thing that reads it), and it gates the ROUTE as well as
# the panel — `POST /api/gabi/turn` answers a worded **404** here: disabled, not
# open, the same idiom EBOOK_INGEST_TOKEN and DONOR_TOKEN use. ⚠️ NOT 403, which
# in this app means exactly one thing — your ROLE does not permit this — and
# reusing it for "this feature does not exist here" would send somebody asking
# for a role that would not help. Hiding a control has never been the lock in
# this app either; see the /people nav comment in App.tsx.
#
# Unset or unrecognised both mean OFF. It is written out rather than omitted so
# that "is GABI on here?" has an answer in this file, not an absence — and
# `apps/worker/src/routes/gabi.test.ts` reads BOTH values below and fails if the
# posture ever stops matching the design.
#
# "on" since 2026-08-17 (owner: "Add it to my catalog for my wife to use") —
# supersedes §12.8's v1-no, per his standing "we can always change later".
# Amber is admin here (measured), so she sees the panel the moment this
# deploys; conversations on this instance spend the OWNER's key.
GABI_PANEL = "on"

# ⚠️ Where an uploaded cover is READ from. Both this and the COVERS binding must
# be set or the route refuses to write — storing an object and then being unable
# to say where it went is the failure that guard exists for.
#
# ⚠️ NOT `covers.heygabi.ai`. That hostname is already attached to the sibling's
# `audiobook-covers` bucket, and a custom domain belongs to exactly one bucket.
# Checked before choosing this name.
#
# It is a custom domain rather than the bucket's `*.r2.dev` URL because r2.dev is
# rate-limited and uncacheable — every cover on every page load would reach
# origin. A Cache Rule (`bookcovers.heygabi.ai/*` → Edge TTL 1 year) is safe here
# in a way it is not for the Worker's own paths, because object names are a hash
# of the file contents: a replaced cover is a different URL, so a cached copy can
# never be stale.
COVERS_BASE_URL = "https://bookcovers.heygabi.ai"

# ⚠️ THE SHARED-IDENTITY SETTING. Must stay `audiobook-catalog` — the same
# Firebase project the audiobook site signs into. This is the entire mechanism by
# which one Google account is one person across both catalogs. Changing it does
# not "switch projects", it silently forks every user into a second account.
FIREBASE_PROJECT_ID = "audiobook-catalog"

# The recovery hatch. Any email listed here is forced to `owner` when it signs
# in — every sign-in, not just the first — regardless of its app_user row.
#
# It was empty while there were two owners, because each was the other's way
# back in. ⚠️ As of 2026-08-10 there is exactly one owner and the second account
# is a `manager`, which cannot change roles. Nothing else can restore ownership
# now, so without this the only route back would be hand-editing D1.
#
# Set for the same reason and to the same address as the board game catalog's.
OWNER_EMAILS = "nbaslamking@gmail.com"

# The shared index Worker (catalog-platform/apps/index-worker) — deliberately
# COMMENTED until the dispatcher's deploy step, matching the games catalog's
# precedent (its INDEX_URL stayed unset until index.heygabi.ai went live).
# With it unset every push trigger in lib/index-push.ts logs one line and does
# nothing, so the code deploys inert. At the deploy step: uncomment this, and
# set the token as a secret —
#   npx wrangler secret put INDEX_PUSH_TOKEN --config apps/worker/wrangler.toml
# (= the same value the index Worker holds as INDEX_PUSH_TOKEN_LIBRARY; that
# name exists there but its value is minted at the same step). Or via
# `.dev.vars` + `npm run secrets:push` — INDEX_PUSH_TOKEN is allowlisted.
# INDEX_URL = "https://index.heygabi.ai"
INDEX_URL = "https://index.heygabi.ai"

# ── Donor reciprocity (owner decision 2026-08-20) ────────────────────────────
# The main library now asks the friend for details too, before paying for AI.
# Same DONOR_TOKEN secret already set on both instances (2026-08-16).
DONOR_URL = "https://padhard.heygabi.ai"

# ── Cross-library peer push (migration 0370) ─────────────────────────────────
#
# Each instance pushes its work_key set to every configured peer after catalog
# mutations. The peer stores the snapshot in `peer_holding` and the series +
# work routes show "In the Padhard Library" badges on gap rungs. PEER_TOKEN
# (shared secret, same value all instances) is set via `wrangler secret put`.
#
# ⚠️ Adding a new library to the network: append one entry here AND add an
# entry for this instance to the new library's PEERS. Then deploy both.
PEER_SELF_ID = "sky"
PEER_SELF_LABEL = "Sky's Library"
SITE_ORIGIN = "https://library.heygabi.ai"
PEERS = "[{\"id\":\"padhard\",\"label\":\"the Padhard Library\",\"url\":\"https://padhard.heygabi.ai\"}]"

# ── Estate auth (catalog-platform/docs/info/estate-auth-design.md §14.5) ──────
#
# ⚠️ `off` ON PURPOSE: the deploy that carries the estate-auth code must be
# inert until the dispatcher flips this to "shadow" (observe + log, enforce
# nothing) and, much later and only after days of clean shadow logs, "enforce"
# — which this revision does NOT implement (it logs `enforce_requested` and
# behaves as shadow). Shadow's output is one `estate_shadow` JSON line per
# authenticated request in `wrangler tail`; grep for `"would_deny":true` and
# expect zero for household members before ever going further.
#
# The third leg is the secret `ESTATE_APP_TOKEN_LIBRARY` (never here — set via
# `wrangler secret put` or `.dev.vars` + `npm run secrets:push`; the auth
# Worker holds the matching value under the same name). With it unset, shadow
# logs `estate_config_unset` and behaves as off — deploying code before secret
# is the intended order, and it is safe.
ESTATE_CHECK = "enforce"
ESTATE_AUTH_URL = "https://auth.heygabi.ai"

# ── WHICH estate consumer this Worker IS ─────────────────────────────────────
#
# The directory knows five consumers (`CONSUMER_APPS` in the auth Worker's
# env.ts) and tells them apart BY THE BEARER VALUE they present. This repo is
# two of them from one build: `library` here, `library2` on [env.friend].
#
# ⚠️ Written out rather than omitted, the DEFAULT_THEME/GABI_PANEL idiom: "what
# is this instance's estate identity" must have an ANSWER in this file, not an
# absence. It also names which secret carries the bearer —
# ESTATE_APP_TOKEN_LIBRARY here, ESTATE_APP_TOKEN_LIBRARY2 on hers — because
# the estate's pairing rule is one value, two holders, SAME NAME both sides.
#
# ⚠️ Until 2026-08-17 this was a hard-coded 'library' in
# packages/estate-auth/src/gate.ts, so HER instance asserted OUR identity and
# the auth Worker's ESTATE_APP_TOKEN_LIBRARY2 was an orphan nothing presented
# (estate credentials catalog F-5). Changing either instance's value is an
# identity change at the directory, never a tidy-up;
# `packages/estate-auth/test/instance-estate-app.test.ts` reads this file and
# fails if the two instances ever name the same app.
ESTATE_APP = "library"

# ── GABI's DELEGATED DOOR (routes/gabi-delegated.ts, 2026-08-18) ─────────────
#
# Owner ask 2026-08-17: *"Can I dm her an isbn or a photo and she adds it to
# the catalog?"* / *"Hey Gabi, fix all my missing details."* Approved as Tier 1
# of the T0–T4 ladder: additive writes with easy undo, auto-apply then report.
#
# There is NO var here, on purpose — the door is switched on entirely by the
# presence of ONE SECRET, which is never written in this file:
#
#   wrangler secret put ESTATE_APP_TOKEN_DISCORD        (main instance)
#   npm run secret:friend -- ESTATE_APP_TOKEN_DISCORD   (her instance)
#
# ⚠️ ONE VALUE, THREE HOLDERS, THE SAME NAME ON ALL THREE — the estate's
# established pairing idiom (DONOR_TOKEN's, INDEX_PUSH_TOKEN's): mint it once
# with `openssl rand -hex 32`, pipe it to BOTH instances of this Worker AND to
# `catalog-platform/apps/discord-worker`. Never echoed, never pasted on a
# terminal line, never in a tracked file.
#
# ⚠️ Unset means the delegated routes answer a WORDED 503 and write nothing —
# so this code is safe to deploy before the secret exists, which is the
# intended order. `GET /api/health` reports `gabi.delegated` as the boolean
# "is the NAME populated here" (never the value, and never proof of a pairing).
#
# ⚠️ Holding the value authorises NO WRITE. It proves only "this request came
# from the estate's Discord Worker". Every writing verb then resolves the
# on-behalf-of Firebase uid to an `app_user` row ON THIS INSTANCE and checks
# that person's own capability — `editCatalog` to add a book, `runResearch` to
# run the details sweep, exactly what the equivalent button needs. That is the
# whole security design: GABI holds nothing and borrows the asker's role, and
# the DESTINATION site is what checks it.

# ═════════════════════════════════════════════════════════════════════════════
# [env.friend] — the SECOND library instance (friend-ingest-design.md §6).
#
# Same Worker code, own data. Deploys as a separate Worker named
# `library-catalog-friend` with its own D1, its own covers bucket, and its own
# hostname. ⚠️ Wrangler environments do NOT inherit bindings, vars, routes or
# triggers from the top level, so everything her instance needs is restated
# here explicitly — an omission here is a missing binding on HER worker, not a
# fallback to the main one.
#
# ⚠️ NAMING: the hostname is `padhard.heygabi.ai` (owner decision 2026-08-16,
# replacing the temporary `sam.heygabi.ai`). Everything PERMANENT is
# identity-neutral: env `friend`, D1 `library-catalog-2nd`, bucket
# `library-2nd-covers`. Never rename those to match whatever the hostname
# becomes — the hostname is the only thing allowed to change.
#
# Deploy with `npm run deploy:friend` (never plain `wrangler deploy --env
# friend` — the npm script carries the clean-tree and overlap guards).
# ═════════════════════════════════════════════════════════════════════════════

[env.friend]
# Worker name would default to `library-catalog-friend` anyway; pinned so a
# wrangler behaviour change can never silently deploy over the main Worker.
name = "library-catalog-friend"
workers_dev = true

# Same built PWA — one product, two instances.
[env.friend.assets]
directory = "../web/dist"
binding = "ASSETS"

[[env.friend.d1_databases]]
binding = "DB"
database_name = "library-catalog-2nd"
# Created 2026-08-16 in region WNAM, account nbaslamking@gmail.com. Empty at
# creation; the shared migrations_dir means her schema is applied from the
# same files as the main instance's — `npm run db:migrate:friend`.
database_id = "9dcf4af9-d1a2-4de4-adcf-ac7eea77f1c8"
migrations_dir = "../../migrations"

[[env.friend.r2_buckets]]
binding = "COVERS"
bucket_name = "library-2nd-covers"

# Same cron STRING as the main instance, deliberately — `scheduled()` in
# src/index.ts dispatches on DETAILS_SWEEP_CRON and an unrecognised cron does
# nothing. A different minute here would silently disable her details sweep.
#
# ⚠️ CORRECTED 2026-08-17 (estate credentials catalog F-8). This comment used
# to say the sweep "runs and skips itself" for want of an ANTHROPIC_API_KEY.
# It has not been true since 2026-08-16 late: her OWN Anthropic key is set on
# this env (`wrangler secret list --env friend` confirms the name), so her
# hourly tick runs DONOR-THEN-AI — the main library answers what it can for
# free, and whatever is left is asked of HER key and spends HER money. The
# config of record must not keep claiming she cannot spend.
[env.friend.triggers]
crons = ["7 * * * *"]

# Hostname settled 2026-08-16 (was `sam.heygabi.ai` for a few hours) — see the
# naming note above. Changing it again is: edit this pattern, add the new host
# to Firebase Authorised domains, redeploy. Nothing else knows the name.
#
# ⚠️ Firebase: add this host to Authentication → Settings → Authorised domains
# BEFORE she sees the URL, or Google sign-in fails `auth/unauthorized-domain`.
# The workers.dev URL (library-catalog-friend.<account>.workers.dev) works
# regardless, subject to the same Firebase-domain requirement.
[[env.friend.routes]]
pattern = "padhard.heygabi.ai"
custom_domain = true

[env.friend.vars]
APP_VERSION = "0.1.0"
ENVIRONMENT = "production"

# Her instance's identity: the pixel-hearts theme (owner 2026-08-16, verbatim
# — "Make that a theme and let it be the default for padhard"). Pink and
# white, 8-bit hearts, retro's chunky grammar. See the main [vars] block for
# why the Worker does not read this and where it is actually resolved; the
# hostname this string is paired with is the [[env.friend.routes]] pattern
# above, and the test asserts exactly that pairing.
DEFAULT_THEME = "hearts"

# ── GABI, the conversational fixer — ON HERE, AND ONLY HERE ──────────────────
#
# The owner's ask, verbatim (2026-08-16 late): "in the future i want Sam to be
# able to ask gabi to fix books for her like id ask you. it'd be done through
# api but it would have the needed context to fix things." Surface order settled
# 2026-08-17: SITE PANEL first, Discord DM the next phase after.
#
# PHASE 0 IS READ-ONLY. The four tools GABI holds today (find_book, get_book,
# list_gaps, list_recent_changes) cannot change anything, and `@lc/core`'s
# `packages/core/test/gabi-tools.test.ts` fails the build if a write tool is
# added to the array. So switching this on here spends her ANTHROPIC_API_KEY on
# conversation and risks nothing in her catalog.
#
# ⚠️ It gates the ROUTE too, not just the panel — `POST /api/gabi/turn` answers
# a worded 404 (disabled, not open) wherever this is not "on", never a 403.
# See the main [vars] block for why that distinction is load-bearing.
GABI_PANEL = "on"

# The bucket's managed r2.dev public URL, enabled 2026-08-16. This WORKS —
# the app only ever concatenates `COVERS_BASE_URL + '/' + objectKey` — but
# r2.dev is rate-limited and uncacheable (the exact reason the main instance
# fronts its bucket with bookcovers.heygabi.ai). Fine for launch; when her
# hostname settles, attach a custom domain to the bucket + a 1-year Cache Rule
# (object names are content hashes, so a cached copy can never be stale) and
# change only this line.
COVERS_BASE_URL = "https://pub-6521c378bf4b4ac3b17d5ac898832819.r2.dev"

# Same shared Firebase project as every catalog — one Google account is one
# person estate-wide. See the main [vars] warning; it applies verbatim.
FIREBASE_PROJECT_ID = "audiobook-catalog"

# The owner's break-glass standing on her instance (friend-ingest-design.md
# §5): remote support is "sign into her hostname and do anything she can".
OWNER_EMAILS = "nbaslamking@gmail.com"

# ── Donor-first details sweep (owner ask 2026-08-16) ─────────────────────────
# Her donor is the MAIN library: with this plus the DONOR_TOKEN secret (set on
# both instances 2026-08-16), her hourly sweep asks library.heygabi.ai's
# /api/donor/details for each book's missing details BEFORE any AI lookup, and
# heals from our catalog for free.
#
# ⚠️ CORRECTED 2026-08-17 (F-8): "instead of any AI lookup … donor-only mode"
# was true for a few hours on 2026-08-16 and is not true now. She has her own
# ANTHROPIC_API_KEY, so the sweep is DONOR-THEN-AI: donor first (free, and the
# whole point of the owner's ask — *"if I have Stormlight Archive don't have
# her look it up"*), her key only for what the donor could not answer.
#
# ⚠️ The MAIN instance's [vars] deliberately has NO DONOR_URL yet — reciprocity
# (our sweep asking HER catalog) is a later owner decision, and it is exactly
# one line there when it comes: DONOR_URL = "https://padhard.heygabi.ai".
# Wrangler will nag that DONOR_URL "exists on env.friend but not at top level";
# that nag is the same INDEX_URL one documented in docs/access/
# second-instance.md, and it is correct to ignore.
DONOR_URL = "https://library.heygabi.ai"

# ── Cross-library peer push (migration 0370) ─────────────────────────────────
# Same mechanism as the main instance: pushes her holdings to all peers after
# mutations. The main library appears on HER gap rungs as "In Sky's Library".
PEER_SELF_ID = "padhard"
PEER_SELF_LABEL = "the Padhard Library"
SITE_ORIGIN = "https://padhard.heygabi.ai"
PEERS = "[{\"id\":\"sky\",\"label\":\"Sky's Library\",\"url\":\"https://library.heygabi.ai\"}]"

# ── The estate index: READ is ON here, PUSH is still OFF ─────────────────────
#
# ⚠️ This block said INDEX_URL was "deliberately ABSENT" until 2026-08-25. Half
# of that is still true and the half that changed is the free-details ladder.
#
# **READ (on, 2026-08-25).** `lib/free-details.ts` rung 2 asks the index
# `GET /api/machine/lookup?title=…` before anything is paid for, and it needs a
# host. She is her OWN calling app there — the index's MACHINE_APPS knows her as
# `library2` and holds her value as INDEX_READ_TOKEN_LIBRARY2, which she
# presents as the secret INDEX_READ_TOKEN. ⚠️ NOT main's value: the index
# resolves the caller FROM the value, so sharing one would make the app name
# meaningless and one leak would revoke both instances. Set with
# `npm run secret:friend -- INDEX_READ_TOKEN`; push-secrets.mjs refuses to send
# it in a bulk run, on purpose.
#
# ⚠️ Holding it does NOT widen what she can see. Every machine caller resolves
# to {audiobook, library, games} — so `library2` the APP cannot read `library2`
# the SHELF, and that is deliberate, not an oversight to tidy up.
#
# **PUSH (still off).** Her estate-index INGEST is still PHASE 2
# (friend-ingest-design.md §7). `lib/index-push.ts` requires INDEX_URL *and*
# INDEX_PUSH_TOKEN together, and hers stays unset — so setting this host turns
# the read half on and leaves the write half exactly as inert as before.
# ⚠️ Do not "complete the pair" by minting INDEX_PUSH_TOKEN here: that is
# federation day, and it labels her rows on a shelf other people can see.
INDEX_URL = "https://index.heygabi.ai"

# Estate auth: same mode as the main instance's production posture (enforce,
# flipped after its shadow soak). ⚠️ Until the ESTATE_APP_TOKEN_LIBRARY2
# secret is set on THIS env, the gate logs `estate_config_unset` and behaves
# as OFF — local-only auth, new sign-ins land as `pending` with no role. That
# ordering is safe and intended: code before secret.
ESTATE_CHECK = "enforce"
ESTATE_AUTH_URL = "https://auth.heygabi.ai"

# ── THIS instance is `library2`, and that is the whole of the F-5 fix ─────────
#
# She is her OWN estate consumer: her own bearer, her own `seen:library2`
# origin on a newcomer's directory row, and the `vis_library2` column
# (auth-worker migration 0007, DEFAULT 0 — "another household's shelf") finally
# describing the door people actually knock on.
#
# ⚠️ Before 2026-08-17 the app id was hard-coded `library` in gate.ts, so this
# Worker presented the MAIN library's identity: the directory attributed her
# sign-ins to `library`, and ESTATE_APP_TOKEN_LIBRARY2 on the auth Worker was
# an orphan (estate credentials catalog F-5).
#
# ⚠️ THE PAIRED SECRET IS `ESTATE_APP_TOKEN_LIBRARY2` — a different NAME from
# the `ESTATE_APP_TOKEN_LIBRARY` this env used to hold, deliberately, so the
# estate's "same name both sides" rule holds here too. A missing name fails
# into OFF (loud, local-auth-only, nobody locked out); a wrong VALUE would
# fail into 401-from-the-directory. That is why the name changed rather than
# the value being moved under the old one.
#
# Setting this to anything but "library2" here is an identity change at the
# directory. `packages/estate-auth/test/instance-estate-app.test.ts` fails if
# it ever matches the main instance's.
ESTATE_APP = "library2"

# ── The paused owner decision: her default role ──────────────────────────────
# friend-ingest-design.md §3 recommends auto-granting `moderator` on HER
# instance (so shelf-photo scanning works with no coordination call). The
# owner has PAUSED that decision, so she launches as `member` like everyone
# else. When the owner decides, the flip is EXACTLY this one line:
#
# ESTATE_DEFAULT_ROLE = "moderator"
#
# (Read by packages/estate-auth/src/gate.ts — unset or invalid falls back to
# the posture's `member`. Access-increasing: anyone the estate approves with
# visibility into her catalog gets that role there. Do not flip it as a side
# effect of anything.)

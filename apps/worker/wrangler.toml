name = "library-catalog"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The built React PWA. Static files are served directly; anything that is not a
# file falls through to the Worker, which serves index.html for SPA routes.
# Run `npm run build` at the repo root before `wrangler dev` or `deploy`.
[assets]
directory = "../web/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "library-catalog"
# Created 2026-08-09 in region WNAM, account nbaslamking@gmail.com.
#
# ⚠️ The binding stays `DB`, not the `library_catalog` that `wrangler d1 create`
# suggests in its copy-paste snippet. `env.ts` and every query in `packages/db`
# take `c.env.DB`; renaming the binding to match the snippet would break all of
# them for no gain.
database_id = "6022ea5e-2510-450e-81ce-7d847fa31379"
# Migrations live at the repo root so the CLI can reach them too.
migrations_dir = "../../migrations"

# ⚠️ No R2 bucket for SCAN PHOTOS, and that is permanent. They go from the upload
# request straight into the vision call and are gone. The sibling project removed
# its bucket for exactly this reason — it was write-only, nothing ever read an
# object back, so its whole purpose was to be deleted later, and one code path
# forgetting to delete was all it would have taken to keep photos forever.
#
# COVERS ARE THE OPPOSITE CASE and have their own bucket, added 2026-08-11. A
# cover is read on every page load forever and deleting one is the bug. Do not
# read the rule above as "this project does not use R2" — it is about photographs.
[[r2_buckets]]
binding = "COVERS"
bucket_name = "library-covers"

# This Worker's FIRST cron trigger (added 2026-08-16). Everything below about
# what a cron does and does not prove was written while there were none; it all
# still applies, and now there is something to apply it to.
#
# "7 * * * *" — the hourly missing-details sweep (owner ask 2026-08-16): if a
# book is still missing a detail nobody has ever looked for, look for it,
# without being asked. `src/lib/details-sweep.ts` carries the whole design.
#
# ⚠️ This string is dispatched on by `scheduled()` in src/index.ts via
# DETAILS_SWEEP_CRON, and an unrecognised cron there does NOTHING rather than
# guessing. Change one of the two and the sweep stops firing while both files
# still look correct — which is why details-sweep.test.ts reads this file and
# asserts the string is still here.
#
# Minute 7, not 0: every cron in the world fires on the hour, and this one has
# no reason to join the stampede.
#
# ⚠️ The rule from the sibling project, learned from weeks of `wrangler deploy`
# reporting registered triggers that never fired: **a cron is not working until
# something it writes has rows.** For this one the proof is a `research_run` row
# with `triggered_by` NULL — that is precisely how a sweep's run is
# distinguishable from a person's. Until such a row exists, this trigger is
# claimed, not verified.
[triggers]
crons = ["7 * * * *"]

# The public hostname. Declared here rather than clicked in the dashboard so the
# mapping lives in git and a redeploy reasserts it.
#
# `custom_domain = true` makes Cloudflare create and manage the DNS record and
# the certificate. It works because heygabi.ai is registered in this same account
# (confirmed 2026-08-10), so the zone is already present — no nameserver change.
#
# ⚠️ ORDER MATTERS. Add `library.heygabi.ai` to Firebase Authentication →
# Settings → Authorised domains BEFORE relying on this host, or Google sign-in
# fails there with `auth/unauthorized-domain`. The workers.dev URL keeps working
# throughout, so there is no outage either way — but the new host will look
# broken at sign-in until Firebase knows about it.
#
# ⚠️ `library.` and not `books.`, deliberately. See catalog-platform's
# HEYGABI_LAYOUT.md §1.1: `books.` implies a sibling `ebooks.` host, and once
# both names exist someone eventually makes them two apps — which that document
# decided against, because splitting duplicates `work_key` and makes two apps
# write the same Firestore review document.
[[routes]]
pattern = "library.heygabi.ai"
custom_domain = true

[vars]
APP_VERSION = "0.1.0"
ENVIRONMENT = "production"

# ⚠️ Where an uploaded cover is READ from. Both this and the COVERS binding must
# be set or the route refuses to write — storing an object and then being unable
# to say where it went is the failure that guard exists for.
#
# ⚠️ NOT `covers.heygabi.ai`. That hostname is already attached to the sibling's
# `audiobook-covers` bucket, and a custom domain belongs to exactly one bucket.
# Checked before choosing this name.
#
# It is a custom domain rather than the bucket's `*.r2.dev` URL because r2.dev is
# rate-limited and uncacheable — every cover on every page load would reach
# origin. A Cache Rule (`bookcovers.heygabi.ai/*` → Edge TTL 1 year) is safe here
# in a way it is not for the Worker's own paths, because object names are a hash
# of the file contents: a replaced cover is a different URL, so a cached copy can
# never be stale.
COVERS_BASE_URL = "https://bookcovers.heygabi.ai"

# ⚠️ THE SHARED-IDENTITY SETTING. Must stay `audiobook-catalog` — the same
# Firebase project the audiobook site signs into. This is the entire mechanism by
# which one Google account is one person across both catalogs. Changing it does
# not "switch projects", it silently forks every user into a second account.
FIREBASE_PROJECT_ID = "audiobook-catalog"

# The recovery hatch. Any email listed here is forced to `owner` when it signs
# in — every sign-in, not just the first — regardless of its app_user row.
#
# It was empty while there were two owners, because each was the other's way
# back in. ⚠️ As of 2026-08-10 there is exactly one owner and the second account
# is a `manager`, which cannot change roles. Nothing else can restore ownership
# now, so without this the only route back would be hand-editing D1.
#
# Set for the same reason and to the same address as the board game catalog's.
OWNER_EMAILS = "nbaslamking@gmail.com"

# The shared index Worker (catalog-platform/apps/index-worker) — deliberately
# COMMENTED until the dispatcher's deploy step, matching the games catalog's
# precedent (its INDEX_URL stayed unset until index.heygabi.ai went live).
# With it unset every push trigger in lib/index-push.ts logs one line and does
# nothing, so the code deploys inert. At the deploy step: uncomment this, and
# set the token as a secret —
#   npx wrangler secret put INDEX_PUSH_TOKEN --config apps/worker/wrangler.toml
# (= the same value the index Worker holds as INDEX_PUSH_TOKEN_LIBRARY; that
# name exists there but its value is minted at the same step). Or via
# `.dev.vars` + `npm run secrets:push` — INDEX_PUSH_TOKEN is allowlisted.
# INDEX_URL = "https://index.heygabi.ai"
INDEX_URL = "https://index.heygabi.ai"

# ── Estate auth (catalog-platform/docs/info/estate-auth-design.md §14.5) ──────
#
# ⚠️ `off` ON PURPOSE: the deploy that carries the estate-auth code must be
# inert until the dispatcher flips this to "shadow" (observe + log, enforce
# nothing) and, much later and only after days of clean shadow logs, "enforce"
# — which this revision does NOT implement (it logs `enforce_requested` and
# behaves as shadow). Shadow's output is one `estate_shadow` JSON line per
# authenticated request in `wrangler tail`; grep for `"would_deny":true` and
# expect zero for household members before ever going further.
#
# The third leg is the secret `ESTATE_APP_TOKEN_LIBRARY` (never here — set via
# `wrangler secret put` or `.dev.vars` + `npm run secrets:push`; the auth
# Worker holds the matching value under the same name). With it unset, shadow
# logs `estate_config_unset` and behaves as off — deploying code before secret
# is the intended order, and it is safe.
ESTATE_CHECK = "enforce"
ESTATE_AUTH_URL = "https://auth.heygabi.ai"

# ═════════════════════════════════════════════════════════════════════════════
# [env.friend] — the SECOND library instance (friend-ingest-design.md §6).
#
# Same Worker code, own data. Deploys as a separate Worker named
# `library-catalog-friend` with its own D1, its own covers bucket, and its own
# hostname. ⚠️ Wrangler environments do NOT inherit bindings, vars, routes or
# triggers from the top level, so everything her instance needs is restated
# here explicitly — an omission here is a missing binding on HER worker, not a
# fallback to the main one.
#
# ⚠️ NAMING: the hostname is `padhard.heygabi.ai` (owner decision 2026-08-16,
# replacing the temporary `sam.heygabi.ai`). Everything PERMANENT is
# identity-neutral: env `friend`, D1 `library-catalog-2nd`, bucket
# `library-2nd-covers`. Never rename those to match whatever the hostname
# becomes — the hostname is the only thing allowed to change.
#
# Deploy with `npm run deploy:friend` (never plain `wrangler deploy --env
# friend` — the npm script carries the clean-tree and overlap guards).
# ═════════════════════════════════════════════════════════════════════════════

[env.friend]
# Worker name would default to `library-catalog-friend` anyway; pinned so a
# wrangler behaviour change can never silently deploy over the main Worker.
name = "library-catalog-friend"
workers_dev = true

# Same built PWA — one product, two instances.
[env.friend.assets]
directory = "../web/dist"
binding = "ASSETS"

[[env.friend.d1_databases]]
binding = "DB"
database_name = "library-catalog-2nd"
# Created 2026-08-16 in region WNAM, account nbaslamking@gmail.com. Empty at
# creation; the shared migrations_dir means her schema is applied from the
# same files as the main instance's — `npm run db:migrate:friend`.
database_id = "9dcf4af9-d1a2-4de4-adcf-ac7eea77f1c8"
migrations_dir = "../../migrations"

[[env.friend.r2_buckets]]
binding = "COVERS"
bucket_name = "library-2nd-covers"

# Same cron STRING as the main instance, deliberately — `scheduled()` in
# src/index.ts dispatches on DETAILS_SWEEP_CRON and an unrecognised cron does
# nothing. A different minute here would silently disable her details sweep.
# With no ANTHROPIC_API_KEY on this env the sweep runs and skips itself
# (`skipped: no ANTHROPIC_API_KEY`, details-sweep.ts:273) — free, and it
# starts healing details the day a key is ever added.
[env.friend.triggers]
crons = ["7 * * * *"]

# Hostname settled 2026-08-16 (was `sam.heygabi.ai` for a few hours) — see the
# naming note above. Changing it again is: edit this pattern, add the new host
# to Firebase Authorised domains, redeploy. Nothing else knows the name.
#
# ⚠️ Firebase: add this host to Authentication → Settings → Authorised domains
# BEFORE she sees the URL, or Google sign-in fails `auth/unauthorized-domain`.
# The workers.dev URL (library-catalog-friend.<account>.workers.dev) works
# regardless, subject to the same Firebase-domain requirement.
[[env.friend.routes]]
pattern = "padhard.heygabi.ai"
custom_domain = true

[env.friend.vars]
APP_VERSION = "0.1.0"
ENVIRONMENT = "production"

# The bucket's managed r2.dev public URL, enabled 2026-08-16. This WORKS —
# the app only ever concatenates `COVERS_BASE_URL + '/' + objectKey` — but
# r2.dev is rate-limited and uncacheable (the exact reason the main instance
# fronts its bucket with bookcovers.heygabi.ai). Fine for launch; when her
# hostname settles, attach a custom domain to the bucket + a 1-year Cache Rule
# (object names are content hashes, so a cached copy can never be stale) and
# change only this line.
COVERS_BASE_URL = "https://pub-6521c378bf4b4ac3b17d5ac898832819.r2.dev"

# Same shared Firebase project as every catalog — one Google account is one
# person estate-wide. See the main [vars] warning; it applies verbatim.
FIREBASE_PROJECT_ID = "audiobook-catalog"

# The owner's break-glass standing on her instance (friend-ingest-design.md
# §5): remote support is "sign into her hostname and do anything she can".
OWNER_EMAILS = "nbaslamking@gmail.com"

# ── Donor-first details sweep (owner ask 2026-08-16) ─────────────────────────
# Her donor is the MAIN library: with this plus the DONOR_TOKEN secret (set on
# both instances 2026-08-16), her hourly sweep asks library.heygabi.ai's
# /api/donor/details for each book's missing details before (in her case,
# instead of) any AI lookup — she has no ANTHROPIC_API_KEY, so her sweep runs
# in donor-only mode and heals from our catalog for free.
#
# ⚠️ The MAIN instance's [vars] deliberately has NO DONOR_URL yet — reciprocity
# (our sweep asking HER catalog) is a later owner decision, and it is exactly
# one line there when it comes: DONOR_URL = "https://padhard.heygabi.ai".
# Wrangler will nag that DONOR_URL "exists on env.friend but not at top level";
# that nag is the same INDEX_URL one documented in docs/access/
# second-instance.md, and it is correct to ignore.
DONOR_URL = "https://library.heygabi.ai"

# ⚠️ INDEX_URL deliberately ABSENT — her estate-index integration is PHASE 2
# (friend-ingest-design.md §7). Unset means every push trigger in
# lib/index-push.ts logs one line and does nothing: inert by design, the
# games-catalog precedent. Same for the INDEX_PUSH_TOKEN secret.

# Estate auth: same mode as the main instance's production posture (enforce,
# flipped after its shadow soak). ⚠️ Until the ESTATE_APP_TOKEN_LIBRARY secret
# is set on THIS env, the gate logs `estate_config_unset` and behaves as OFF —
# local-only auth, new sign-ins land as `pending` with no role. That ordering
# is safe and intended: code before secret.
ESTATE_CHECK = "enforce"
ESTATE_AUTH_URL = "https://auth.heygabi.ai"

# ── The paused owner decision: her default role ──────────────────────────────
# friend-ingest-design.md §3 recommends auto-granting `moderator` on HER
# instance (so shelf-photo scanning works with no coordination call). The
# owner has PAUSED that decision, so she launches as `member` like everyone
# else. When the owner decides, the flip is EXACTLY this one line:
#
# ESTATE_DEFAULT_ROLE = "moderator"
#
# (Read by packages/estate-auth/src/gate.ts — unset or invalid falls back to
# the posture's `member`. Access-increasing: anyone the estate approves with
# visibility into her catalog gets that role there. Do not flip it as a side
# effect of anything.)

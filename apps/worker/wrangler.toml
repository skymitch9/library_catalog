name = "library-catalog"
main = "src/index.ts"
compatibility_date = "2025-01-15"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

# The built React PWA. Static files are served directly; anything that is not a
# file falls through to the Worker, which serves index.html for SPA routes.
# Run `npm run build` at the repo root before `wrangler dev` or `deploy`.
[assets]
directory = "../web/dist"
binding = "ASSETS"

[[d1_databases]]
binding = "DB"
database_name = "library-catalog"
# Created 2026-08-09 in region WNAM, account nbaslamking@gmail.com.
#
# ⚠️ The binding stays `DB`, not the `library_catalog` that `wrangler d1 create`
# suggests in its copy-paste snippet. `env.ts` and every query in `packages/db`
# take `c.env.DB`; renaming the binding to match the snippet would break all of
# them for no gain.
database_id = "6022ea5e-2510-450e-81ce-7d847fa31379"
# Migrations live at the repo root so the CLI can reach them too.
migrations_dir = "../../migrations"

# ⚠️ No R2 bucket for SCAN PHOTOS, and that is permanent. They go from the upload
# request straight into the vision call and are gone. The sibling project removed
# its bucket for exactly this reason — it was write-only, nothing ever read an
# object back, so its whole purpose was to be deleted later, and one code path
# forgetting to delete was all it would have taken to keep photos forever.
#
# COVERS ARE THE OPPOSITE CASE and have their own bucket, added 2026-08-11. A
# cover is read on every page load forever and deleting one is the bug. Do not
# read the rule above as "this project does not use R2" — it is about photographs.
[[r2_buckets]]
binding = "COVERS"
bucket_name = "library-covers"

# No cron triggers yet. Phase 5 adds the cover-health sweep; when it does, read
# the sibling project's wrangler.toml note first — its rule is that **a cron is
# not working until something it writes has rows**, learned from weeks of
# `wrangler deploy` reporting registered triggers that never fired.

# The public hostname. Declared here rather than clicked in the dashboard so the
# mapping lives in git and a redeploy reasserts it.
#
# `custom_domain = true` makes Cloudflare create and manage the DNS record and
# the certificate. It works because heygabi.ai is registered in this same account
# (confirmed 2026-08-10), so the zone is already present — no nameserver change.
#
# ⚠️ ORDER MATTERS. Add `library.heygabi.ai` to Firebase Authentication →
# Settings → Authorised domains BEFORE relying on this host, or Google sign-in
# fails there with `auth/unauthorized-domain`. The workers.dev URL keeps working
# throughout, so there is no outage either way — but the new host will look
# broken at sign-in until Firebase knows about it.
#
# ⚠️ `library.` and not `books.`, deliberately. See catalog-platform's
# HEYGABI_LAYOUT.md §1.1: `books.` implies a sibling `ebooks.` host, and once
# both names exist someone eventually makes them two apps — which that document
# decided against, because splitting duplicates `work_key` and makes two apps
# write the same Firestore review document.
[[routes]]
pattern = "library.heygabi.ai"
custom_domain = true

[vars]
APP_VERSION = "0.1.0"
ENVIRONMENT = "production"

# ⚠️ Where an uploaded cover is READ from. Both this and the COVERS binding must
# be set or the route refuses to write — storing an object and then being unable
# to say where it went is the failure that guard exists for.
#
# ⚠️ NOT `covers.heygabi.ai`. That hostname is already attached to the sibling's
# `audiobook-covers` bucket, and a custom domain belongs to exactly one bucket.
# Checked before choosing this name.
#
# It is a custom domain rather than the bucket's `*.r2.dev` URL because r2.dev is
# rate-limited and uncacheable — every cover on every page load would reach
# origin. A Cache Rule (`bookcovers.heygabi.ai/*` → Edge TTL 1 year) is safe here
# in a way it is not for the Worker's own paths, because object names are a hash
# of the file contents: a replaced cover is a different URL, so a cached copy can
# never be stale.
COVERS_BASE_URL = "https://bookcovers.heygabi.ai"

# ⚠️ THE SHARED-IDENTITY SETTING. Must stay `audiobook-catalog` — the same
# Firebase project the audiobook site signs into. This is the entire mechanism by
# which one Google account is one person across both catalogs. Changing it does
# not "switch projects", it silently forks every user into a second account.
FIREBASE_PROJECT_ID = "audiobook-catalog"

# The recovery hatch. Any email listed here is forced to `owner` when it signs
# in — every sign-in, not just the first — regardless of its app_user row.
#
# It was empty while there were two owners, because each was the other's way
# back in. ⚠️ As of 2026-08-10 there is exactly one owner and the second account
# is a `manager`, which cannot change roles. Nothing else can restore ownership
# now, so without this the only route back would be hand-editing D1.
#
# Set for the same reason and to the same address as the board game catalog's.
OWNER_EMAILS = "nbaslamking@gmail.com"

# ── Estate auth (catalog-platform/docs/info/estate-auth-design.md §14.5) ──────
#
# ⚠️ `off` ON PURPOSE: the deploy that carries the estate-auth code must be
# inert until the dispatcher flips this to "shadow" (observe + log, enforce
# nothing) and, much later and only after days of clean shadow logs, "enforce"
# — which this revision does NOT implement (it logs `enforce_requested` and
# behaves as shadow). Shadow's output is one `estate_shadow` JSON line per
# authenticated request in `wrangler tail`; grep for `"would_deny":true` and
# expect zero for household members before ever going further.
#
# The third leg is the secret `ESTATE_APP_TOKEN_LIBRARY` (never here — set via
# `wrangler secret put` or `.dev.vars` + `npm run secrets:push`; the auth
# Worker holds the matching value under the same name). With it unset, shadow
# logs `estate_config_unset` and behaves as off — deploying code before secret
# is the intended order, and it is safe.
ESTATE_CHECK = "shadow"
ESTATE_AUTH_URL = "https://auth.heygabi.ai"
